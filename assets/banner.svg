<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.15); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pingParticle {
      0% { r: 2px; opacity: 0.8; }
      50% { r: 5px; opacity: 0.3; }
      100% { r: 2px; opacity: 0.8; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 9s ease-in-out infinite alternate; transform-origin: 1000px 320px; }
    .traffic-line { stroke-dasharray: 8, 8; animation: dashFlow 2s linear infinite; }
    .traffic-line-rev { stroke-dasharray: 6, 6; animation: dashFlow 2.5s linear infinite reverse; }
    .floating-card-1 { animation: floatNode 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatNode 6s ease-in-out infinite 1s; }
    .pulse-dot { animation: pingParticle 3s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -1px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; font-size: 11px; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Ambient Glowing Orbs (Deep in background) -->
  <g opacity="0.4">
    <circle class="orb-1" cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#glow)"/>
    <circle class="orb-2" cx="1020" cy="330" r="160" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="600" cy="210" r="110" fill="#c084fc" opacity="0.15" filter="url(#glow)"/>
  </g>

  <!-- Background Dynamic Network Flow & Routing Graph (Underneath foreground content) -->
  <g opacity="0.35">
    <!-- Router Hub Node Center -->
    <line x1="150" y1="210" x2="360" y2="210" stroke="#0ea5e9" stroke-width="2" class="traffic-line" />
    <line x1="360" y1="210" x2="600" y2="80" stroke="#6366f1" stroke-width="2" class="traffic-line" />
    <line x1="360" y1="210" x2="600" y2="340" stroke="#a855f7" stroke-width="2" class="traffic-line-rev" />
    <line x1="600" y1="80" x2="840" y2="210" stroke="#6366f1" stroke-width="2" class="traffic-line" />
    <line x1="600" y1="340" x2="840" y2="210" stroke="#a855f7" stroke-width="2" class="traffic-line-rev" />
    <line x1="840" y1="210" x2="1050" y2="210" stroke="#38bdf8" stroke-width="2" class="traffic-line" />

    <circle cx="150" cy="210" r="6" fill="#38bdf8" class="pulse-dot" />
    <circle cx="360" cy="210" r="8" fill="#6366f1" class="pulse-dot" />
    <circle cx="600" cy="80" r="7" fill="#818cf8" class="pulse-dot" />
    <circle cx="600" cy="340" r="7" fill="#c084fc" class="pulse-dot" />
    <circle cx="840" cy="210" r="8" fill="#a855f7" class="pulse-dot" />
    <circle cx="1050" cy="210" r="6" fill="#38bdf8" class="pulse-dot" />
  </g>

  <!-- Dynamic Glass Floating Nodes (Side Visual Accents - kept far from center title) -->
  <g class="floating-card-1" opacity="0.9">
    <g transform="translate(60, 60)">
      <rect width="180" height="60" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
      <circle cx="25" cy="30" r="7" fill="#22c55e" filter="url(#glow-subtle)" />
      <text x="42" y="27" fill="#f1f5f9" class="badge-text">GATEWAY: HEALTHY</text>
      <text x="42" y="44" fill="#94a3b8" font-size="10" font-family="sans-serif">99.999% • 1.2ms p99</text>
    </g>
  </g>

  <g class="floating-card-2" opacity="0.9">
    <g transform="translate(960, 60)">
      <rect width="180" height="60" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
      <circle cx="25" cy="30" r="7" fill="#38bdf8" filter="url(#glow-subtle)" />
      <text x="42" y="27" fill="#f1f5f9" class="badge-text">SMART ROUTING</text>
      <text x="42" y="44" fill="#94a3b8" font-size="10" font-family="sans-serif">Ingress / Envoy / Mesh</text>
    </g>
  </g>

  <!-- FOREGROUND: Main Title and Hero Content (Guaranteed 100% readable & centered in clear foreground) -->
  <!-- Top Category Pill -->
  <g transform="translate(600, 115)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="-115" cy="0" r="5" fill="#38bdf8" class="pulse-dot"/>
    <text x="-95" y="5" fill="#38bdf8" class="badge-text" font-size="12" letter-spacing="1.5">CURATED AWESOME LIST</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="195" text-anchor="middle" fill="url(#title-grad)" class="title-text" font-size="44" filter="url(#glow-subtle)">
    API Gateway &amp; Routing Management
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="240" text-anchor="middle" fill="#cbd5e1" class="subtitle-text" font-size="18">
    Modern API Gateways, Ingress Controllers, Reverse Proxies &amp; Cloud Runtimes
  </text>

  <text x="600" y="268" text-anchor="middle" fill="#94a3b8" class="subtitle-text" font-size="14">
    Comprehensive Benchmarks, SaaS Pricing, Open-Source Matrix, and Star History
  </text>

  <!-- Feature Interactive Highlights / Bottom Pills -->
  <g transform="translate(600, 325)">
    <!-- Pill 1: High Performance -->
    <g transform="translate(-320, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#e2e8f0" class="badge-text">⚡ High Throughput</text>
    </g>
    <!-- Pill 2: Microservices -->
    <g transform="translate(-160, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#e2e8f0" class="badge-text">☸️ Microservices</text>
    </g>
    <!-- Pill 3: Reverse Proxy -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#e2e8f0" class="badge-text">🛡️ Reverse Proxy</text>
    </g>
    <!-- Pill 4: SaaS & Pricing -->
    <g transform="translate(160, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#e2e8f0" class="badge-text">💰 SaaS &amp; Free Tiers</text>
    </g>
    <!-- Pill 5: Open-Source -->
    <g transform="translate(320, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#e2e8f0" class="badge-text">⭐ Open Source OSS</text>
    </g>
  </g>
</svg>
