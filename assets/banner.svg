<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e17"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1b2a4a" stop-opacity=".75"/><stop offset="100%" stop-color="#0d1b2a" stop-opacity=".85"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-subtle" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.15)}}@keyframes floatNode{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pingParticle{0%{r:2px;opacity:.8}50%{r:5px;opacity:.3}}.orb-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 100px}.orb-2{animation:pulseOrb 9s ease-in-out infinite alternate;transform-origin:1000px 320px}.traffic-line{stroke-dasharray:8,8;animation:dashFlow 2s linear infinite}.traffic-line-rev{stroke-dasharray:6,6;animation:dashFlow 2.5s linear infinite reverse}.floating-card-1{animation:floatNode 5s ease-in-out infinite}.floating-card-2{animation:floatNode 6s ease-in-out infinite 1s}.pulse-dot{animation:pingParticle 3s ease-in-out infinite}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-1px}.subtitle-text{font-weight:500}.badge-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:600;font-size:11px}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g opacity=".4"><circle cx="180" cy="90" r="140" fill="#38bdf8" class="orb-1" filter="url(#glow)"/><circle cx="1020" cy="330" r="160" fill="#818cf8" class="orb-2" filter="url(#glow)"/><circle cx="600" cy="210" r="110" fill="#c084fc" filter="url(#glow)" opacity=".15"/></g><g opacity=".35"><line x1="150" x2="360" y1="210" y2="210" stroke="#0ea5e9" stroke-width="2" class="traffic-line"/><line x1="360" x2="600" y1="210" y2="80" stroke="#6366f1" stroke-width="2" class="traffic-line"/><line x1="360" x2="600" y1="210" y2="340" stroke="#a855f7" stroke-width="2" class="traffic-line-rev"/><line x1="600" x2="840" y1="80" y2="210" stroke="#6366f1" stroke-width="2" class="traffic-line"/><line x1="600" x2="840" y1="340" y2="210" stroke="#a855f7" stroke-width="2" class="traffic-line-rev"/><line x1="840" x2="1050" y1="210" y2="210" stroke="#38bdf8" stroke-width="2" class="traffic-line"/><circle cx="150" cy="210" r="6" fill="#38bdf8" class="pulse-dot"/><circle cx="360" cy="210" r="8" fill="#6366f1" class="pulse-dot"/><circle cx="600" cy="80" r="7" fill="#818cf8" class="pulse-dot"/><circle cx="600" cy="340" r="7" fill="#c084fc" class="pulse-dot"/><circle cx="840" cy="210" r="8" fill="#a855f7" class="pulse-dot"/><circle cx="1050" cy="210" r="6" fill="#38bdf8" class="pulse-dot"/></g><g class="floating-card-1" opacity=".9"><g transform="translate(60, 60)"><rect width="180" height="60" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1.5" rx="10"/><circle cx="25" cy="30" r="7" fill="#22c55e" filter="url(#glow-subtle)"/><text x="42" y="27" fill="#f1f5f9" class="badge-text">GATEWAY: HEALTHY</text><text x="42" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">99.999% • 1.2ms p99</text></g></g><g class="floating-card-2" opacity=".9"><g transform="translate(960, 60)"><rect width="180" height="60" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity=".3" stroke-width="1.5" rx="10"/><circle cx="25" cy="30" r="7" fill="#38bdf8" filter="url(#glow-subtle)"/><text x="42" y="27" fill="#f1f5f9" class="badge-text">SMART ROUTING</text><text x="42" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">Ingress / Envoy / Mesh</text></g></g><g transform="translate(600, 115)"><rect width="280" height="32" x="-140" y="-16" fill="#1e293b" fill-opacity=".8" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.2" rx="16"/><circle cx="-115" cy="0" r="5" fill="#38bdf8" class="pulse-dot"/><text x="-95" y="5" fill="#38bdf8" class="badge-text" font-size="12" letter-spacing="1.5">CURATED AWESOME LIST</text></g><text x="600" y="195" fill="url(#title-grad)" class="title-text" filter="url(#glow-subtle)" font-size="44" text-anchor="middle">API Gateway &amp; Routing Management</text><text x="600" y="240" fill="#cbd5e1" class="subtitle-text" font-size="18" text-anchor="middle">Modern API Gateways, Ingress Controllers, Reverse Proxies &amp; Cloud Runtimes</text><text x="600" y="268" fill="#94a3b8" class="subtitle-text" font-size="14" text-anchor="middle">Comprehensive Benchmarks, SaaS Pricing, Open-Source Matrix, and Star History</text><g><g transform="translate(600, 325) translate(-320, 0)"><rect width="140" height="30" x="-70" y="-15" fill="#0f172a" fill-opacity=".85" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="15"/><text x="0" y="4" fill="#e2e8f0" class="badge-text" text-anchor="middle">⚡ High Throughput</text></g><g transform="translate(600, 325) translate(-160, 0)"><rect width="130" height="30" x="-65" y="-15" fill="#0f172a" fill-opacity=".85" stroke="#6366f1" stroke-opacity=".4" stroke-width="1" rx="15"/><text x="0" y="4" fill="#e2e8f0" class="badge-text" text-anchor="middle">☸️ Microservices</text></g><g transform="translate(600, 325) translate(0, 0)"><rect width="130" height="30" x="-65" y="-15" fill="#0f172a" fill-opacity=".85" stroke="#818cf8" stroke-opacity=".4" stroke-width="1" rx="15"/><text x="0" y="4" fill="#e2e8f0" class="badge-text" text-anchor="middle">🛡️ Reverse Proxy</text></g><g transform="translate(600, 325) translate(160, 0)"><rect width="130" height="30" x="-65" y="-15" fill="#0f172a" fill-opacity=".85" stroke="#a855f7" stroke-opacity=".4" stroke-width="1" rx="15"/><text x="0" y="4" fill="#e2e8f0" class="badge-text" text-anchor="middle">💰 SaaS &amp; Free Tiers</text></g><g transform="translate(600, 325) translate(320, 0)"><rect width="140" height="30" x="-70" y="-15" fill="#0f172a" fill-opacity=".85" stroke="#ec4899" stroke-opacity=".4" stroke-width="1" rx="15"/><text x="0" y="4" fill="#e2e8f0" class="badge-text" text-anchor="middle">⭐ Open Source OSS</text></g></g></svg>